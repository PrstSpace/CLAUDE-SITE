services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prst_events}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off container for migrations/seeding: `docker compose run --rm migrate`
  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prst_events}?schema=public
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prst_events}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
